services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TEMP_DIR=/tmp/videos
      - MAX_CONCURRENT=3
      - JOB_TTL_HOURS=2
      - DATABASE_PATH=/app/data/app.db
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      # B站等平台需要登录 Cookie。本地开发可挂载 Netscape 格式 cookies 文件：
      # - COOKIES_FILE=/cookies/cookies.txt
      # AI 总结：复制 backend/.env.example 为 backend/.env 并填写 DEEPSEEK_API_KEY
      # Stripe：在 backend/.env 填写 STRIPE_* / JWT_SECRET
    env_file:
      - ./backend/.env
    volumes:
      - video-temp:/tmp/videos
      - backend-data:/app/data
      # - ./cookies.txt:/cookies/cookies.txt:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_SITE_URL=https://videograb.lianxi.com
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SITE_URL=https://videograb.lianxi.com
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  video-temp:
  backend-data:
