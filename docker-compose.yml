services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TEMP_DIR=/tmp/videos
      - MAX_CONCURRENT=3
      - JOB_TTL_HOURS=2
      - DATABASE_PATH=/app/data/app.db
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      # B站/抖音风控：把 Netscape cookies 放到仓库根 secrets/cookies.txt（勿提交）
      # 文件不存在时 yt-dlp 会自动跳过，无需改 compose
      - COOKIES_FILE=/secrets/cookies.txt
      # AI 总结：复制 backend/.env.example 为 backend/.env 并填写 DEEPSEEK_API_KEY
      # Stripe：在 backend/.env 填写 STRIPE_* / JWT_SECRET
      # 海外机勿设 HF_ENDPOINT=hf-mirror；国内可在 .env 设镜像
    env_file:
      - ./backend/.env
    volumes:
      - video-temp:/tmp/videos
      - backend-data:/app/data
      - hf-cache:/root/.cache/huggingface
      - ./secrets:/secrets:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 留空：浏览器走同源 /api，由 Next rewrites 代理到后端（避免 localhost 混用）
        - NEXT_PUBLIC_API_URL=
        - NEXT_PUBLIC_SITE_URL=https://example.com
        # 构建时写入 rewrites 目标；Compose 网络内服务名是 backend
        - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_SITE_URL=https://example.com
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  video-temp:
  backend-data:
  hf-cache:
